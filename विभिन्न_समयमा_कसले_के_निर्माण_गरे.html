<!DOCTYPE html>
<html lang="ne">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नेपालका ऐतिहासिक निर्माण र निर्माताहरू</title>

    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9c27b0;
            /* बैजनी */
            --secondary-color: #ff9800;
            /* सुन्तला */
            --accent-color: #03a9f4;
            /* हल्का निलो */
            --background-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Mukta', Arial, sans-serif;
            line-height: 1.5;
            /* पाठ क्रप नहोस् भनेर निश्चित गरिएको */
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            overflow-x: hidden;
            font-size: 16px;
        }

        /* ------------------ App Container (Mobile App Look) ------------------ */
        .app-container {
            width: 100%;
            max-width: 600px;
            /* मोबाइल लुकका लागि अधिकतम चौडाइ */
            margin: 0 auto;
            background-color: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 0 20px var(--shadow-color);
            position: relative;
        }

        /* ------------------ Header and Navigation ------------------ */
        .app-header {
            background: linear-gradient(90deg, var(--primary-color), #7b1fa2);
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .app-header h1 {
            font-size: 1.3rem;
            margin: 0;
        }

        /* ------------------ Main Content and Sections ------------------ */
        .main-content {
            padding: 15px;
        }

        .section-card {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 6px 12px var(--shadow-color);
            border-top: 5px solid var(--secondary-color);
            padding: 15px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out forwards;
        }

        .section-card h2 {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #eee;
        }

        /* ------------------ Responsive List Grid (Core Fix Area) ------------------ */
        .data-list {
            display: grid;
            grid-template-columns: 1fr;
            /* मोबाइलमा १ स्तम्भ */
            gap: 10px;
        }

        .list-item {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            /* क्रप नहोस् भनेर ठाडो स्ट्याक */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .list-item::before {
            content: '🏛️';
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .list-item:hover {
            box-shadow: 0 4px 10px var(--shadow-color);
            transform: translateY(-2px);
            background-color: #fffde7;
            /* हल्का एनिमेशन */
        }

        .list-item-label {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: 700;
            border-bottom: 1px dotted var(--secondary-color);
            padding-bottom: 2px;
            margin-bottom: 4px;
        }

        .list-item-value {
            font-size: 1rem;
            color: var(--text-color);
            font-weight: 400;
        }

        /* ------------------ Animations ------------------ */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @media (min-width: 450px) {
            .app-header h1 {
                font-size: 1.6rem;
            }

            .data-list {
                grid-template-columns: repeat(2, 1fr);
            }


            .list-item {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
