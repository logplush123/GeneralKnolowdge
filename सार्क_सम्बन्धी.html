            background-color: #ffffff;

            border: 1px solid #bae6fd;
            animation: fadeIn 0.5s ease-out;
        }

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qa-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }

        .question-text {
            color: #0c4a6e;
            /* Dark teal for high contrast */
            font-size: 1.15rem;
            /* Larger font size for mobile readability */
            line-height: 1.6;
        }

        .answer-text {
            color: #059669;
            /* Medium green for positive/solution look */
            background-color: #ecfdf5;
            /* Very light green background */
            font-weight: 700;
            border-left: 6px solid #10b981;
            /* Brighter green border */
            padding-left: 1.25rem;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.6s ease-out, opacity 0.6s ease-out, padding 0.6s ease-out;
        }

        .answer-text.visible {
            max-height: 200px;
            /* Sufficient height for long content */
            opacity: 1;
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }

        .reveal-button {
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
        }

        .reveal-button:active {
            transform: scale(0.95);
            box-shadow: none;
        }

        .title-bar {
            background-color: #0ea5e9;
            /* Sky blue for header */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
